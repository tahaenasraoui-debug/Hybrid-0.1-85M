name: Release Windows Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to publish a GitHub Release (e.g. v1.0.0); leave blank to upload workflow artifact only"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64 Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Build portable and AVX2+OpenMP Windows binaries
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          g++ -std=c++17 -O3 -Wall -Wextra -Icsrc -static -static-libgcc -static-libstdc++ \
            csrc/main.cpp csrc/engine.cpp -o dist/hybrid_infer.exe
          g++ -std=c++17 -O3 -Wall -Wextra -mavx2 -mfma -fopenmp -Icsrc -static -static-libgcc -static-libstdc++ \
            csrc/main.cpp csrc/engine.cpp -o dist/hybrid_infer-avx2.exe
          for bin in dist/hybrid_infer.exe dist/hybrid_infer-avx2.exe; do
            echo "=== DLL imports for $bin ==="
            objdump -p "$bin" | grep -i "DLL Name"
            if objdump -p "$bin" | grep -iE "DLL Name:.*(libgcc|libstdc\+\+|libgomp|libwinpthread)"; then
              echo "Error: Unexpected MinGW runtime DLL dependency in $bin"
              exit 1
            fi
          done

      - name: Smoke test Windows binaries
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = "Stop"
          foreach ($exe in @(".\dist\hybrid_infer.exe", ".\dist\hybrid_infer-avx2.exe")) {
            Write-Host "=== Smoke check: $exe --help ==="
            & $exe --help
            if ($LASTEXITCODE -ne 0) {
              throw "$exe --help failed with exit code $LASTEXITCODE"
            }

            Write-Host "=== Smoke check: $exe (expect exit 1 + usage when model file is absent) ==="
            $prevEap = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $output = (& $exe 2>&1 | ForEach-Object { "$_" }) -join "`n"
            $exitCode = $LASTEXITCODE
            $ErrorActionPreference = $prevEap
            Write-Host $output
            if ($exitCode -ne 1) {
              throw "Expected exit code 1 from $exe without weights file, got $exitCode"
            }
            if ($output -notmatch "Usage:") {
              throw "Expected usage message from $exe"
            }
          }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $hashes = Get-ChildItem -Path "dist\*.exe" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashes | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-infer-windows-x86_64
          path: |
            dist/hybrid_infer.exe
            dist/hybrid_infer-avx2.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/hybrid_infer.exe
            dist/hybrid_infer-avx2.exe
            dist/SHA256SUMS.txt
