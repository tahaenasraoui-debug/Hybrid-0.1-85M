name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (CPU PyTorch + project requirements)
        run: |
          uv pip install --system --index-url https://download.pytorch.org/whl/cpu "torch>=2.5.0"
          uv pip install --system -r requirements.txt

      - name: Run Ruff lint check
        run: uvx ruff check .

      - name: Build standalone C++ inference binary
        run: |
          make -C csrc
          PORTABLE=1 make -C csrc clean all

      - name: Run pytest test suite
        run: pytest -v
